<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eve — Avatar Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    #canvas { width: 100%; height: 100%; display: block; }

    #ui-overlay {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    #status {
      color: #888;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    #status.connected { color: #4ade80; }
    #status.thinking { color: #facc15; }
    #status.speaking { color: #60a5fa; }

    #speech-bubble {
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 16px;
      max-width: 600px;
      text-align: center;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.3s ease;
      padding: 12px 20px;
      background: rgba(15, 15, 25, 0.85);
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    #speech-bubble.visible { opacity: 1; }

    #input-container {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    #user-input {
      width: 400px;
      padding: 10px 16px;
      background: rgba(30, 30, 50, 0.9);
      border: 1px solid rgba(100, 100, 150, 0.3);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: rgba(100, 150, 255, 0.6); }

    #send-btn {
      padding: 10px 20px;
      background: rgba(60, 60, 120, 0.8);
      border: 1px solid rgba(100, 100, 200, 0.3);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover { background: rgba(80, 80, 160, 0.9); }

    #debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      color: #666;
      font-family: 'SF Mono', monospace;
      font-size: 11px;
      text-align: right;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="ui-overlay">
    <div id="speech-bubble"></div>
    <div id="status">disconnected</div>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="Say something to Eve..." autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </div>
  <div id="debug-panel">
    <div id="fps">-- fps</div>
    <div id="emotion-debug">emotion: --</div>
    <div id="gaze-debug">gaze: --</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
